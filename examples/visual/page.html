<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Plans</title>
		<!--
			Demo page for visual regression checks. `?variant=buggy` seeds a layout bug a DOM
			assertion would not notice: the Upgrade button shifts 6px to the right. The status panel
			holds the usual sources of screenshot nondeterminism: a live clock, a promotion picked at
			random on every load, and an infinite CSS animation.
		-->
		<style>
			:root {
				font-family: sans-serif;
				color: #1d2433;
				background: #f4f6fa;
			}
			body {
				margin: 0;
				padding: 24px;
			}
			main {
				display: flex;
				gap: 24px;
				align-items: flex-start;
			}
			.card {
				width: 280px;
				padding: 20px;
				border-radius: 8px;
				background: #ffffff;
				box-shadow: 0 1px 3px rgb(0 0 0 / 0.15);
			}
			.card h2 {
				margin: 0 0 8px;
				font-size: 20px;
			}
			.card p {
				margin: 0 0 16px;
				font-size: 14px;
			}
			.card button {
				padding: 8px 16px;
				border: 0;
				border-radius: 4px;
				font-size: 14px;
				color: #ffffff;
				background: #2f5bd3;
			}
			.buggy .card button {
				margin-left: 6px;
			}
			.status {
				width: 300px;
				padding: 20px;
				border-radius: 8px;
				background: #ffffff;
			}
			.promo {
				height: 20px;
				margin: 0 0 12px;
				font-size: 14px;
			}
			.spinner {
				width: 24px;
				height: 24px;
				border: 4px solid #d6dcea;
				border-top-color: #2f5bd3;
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body>
		<main>
			<section class="card" data-testid="plan-card">
				<h2>Team plan</h2>
				<p>$24 per seat, billed monthly.</p>
				<button type="button">Upgrade</button>
			</section>
			<aside class="status" data-testid="status">
				<p class="promo" data-testid="promo"></p>
				<p>Last sync <time data-testid="clock"></time></p>
				<div class="spinner" aria-label="Syncing"></div>
			</aside>
		</main>
		<script>
			const promotions = ["Spring sale: 20% off", "Free onboarding call", "New: audit log export", "Invite two teammates, get a month"];

			if (new URLSearchParams(location.search).get("variant") === "buggy") document.body.classList.add("buggy");

			document.querySelector("[data-testid=promo]").textContent = promotions[Math.floor(Math.random() * promotions.length)];

			/**
			 * Show the current time, to the second, in the status panel.
			 *
			 * @returns {void}
			 */
			function renderClock() {
				document.querySelector("[data-testid=clock]").textContent = new Date().toISOString().slice(11, 19) + " UTC";
			}

			renderClock();
			setInterval(renderClock, 200);
		</script>
	</body>
</html>
